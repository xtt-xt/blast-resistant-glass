name: Package AddOn (be+re)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  MOD_NAME: 防爆玻璃
  # 网易行为包强制要求存在的目录（相对行为包根目录）
  REQUIRED_BE_DIRS: entities

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 定位 be / re 目录
        id: dirs
        run: |
          set -e
          BE=$(ls -d behavior_pack*/ 2>/dev/null | head -1)
          RE=$(ls -d resource_pack*/ 2>/dev/null | head -1)
          if [ -z "$BE" ] || [ -z "$RE" ]; then
            echo "::error::缺少 behavior_pack* 或 resource_pack* 目录"
            exit 1
          fi
          echo "be=$BE" >> "$GITHUB_OUTPUT"
          echo "re=$RE" >> "$GITHUB_OUTPUT"
          echo "行为包: $BE / 资源包: $RE"

          for d in ${REQUIRED_BE_DIRS}; do
            if [ -d "${BE}${d}" ]; then
              echo "OK: 已发现强制目录 ${BE}${d}"
            else
              echo "::notice::源码缺少强制目录 ${BE}${d}，打包时会自动补建空目录"
            fi
          done

      - name: 校验 JSON 与 UUID 唯一性
        run: |
          set -e
          python3 - <<'PY'
          import collections
          import json
          import pathlib
          import sys

          bad = []
          bom = []
          uuids = collections.defaultdict(list)

          for p in sorted(pathlib.Path(".").rglob("*.json")):
              if ".git" in p.parts:
                  continue
              raw = p.read_bytes()
              if raw.startswith(b"\xef\xbb\xbf"):
                  bom.append(str(p))
              try:
                  data = json.loads(raw.decode("utf-8-sig"))
              except Exception as exc:
                  bad.append(f"{p}: {exc}")
                  continue
              if not isinstance(data, dict):
                  continue
              header = data.get("header")
              if isinstance(header, dict) and header.get("uuid"):
                  uuids[header["uuid"]].append(str(p))
              for module in data.get("modules") or []:
                  if isinstance(module, dict) and module.get("uuid"):
                      uuids[module["uuid"]].append(f"{p} (module)")

          if bad:
              print("::error::以下 JSON 解析失败：")
              for item in bad:
                  print(f"  - {item}")
              sys.exit(1)

          dup = {k: v for k, v in uuids.items() if len(v) > 1}
          if dup:
              print("::error::存在重复 UUID：")
              for k, v in dup.items():
                  print(f"  - {k}: {', '.join(v)}")
              sys.exit(1)

          if bom:
              print(f"::warning::{len(bom)} 个 JSON 带 UTF-8 BOM（建议去掉，部分工具链会报错）")
              for item in bom[:10]:
                  print(f"  - {item}")

          print(f"OK: JSON 全部合法，共 {len(uuids)} 个 UUID，无重复")
          PY

      - name: Python 语法检查
        run: |
          set -e
          mapfile -t PYFILES < <(find "${{ steps.dirs.outputs.be }}" -type f -name '*.py')
          if [ "${#PYFILES[@]}" -eq 0 ]; then
            echo "未发现 Python 文件，跳过"
          else
            python3 -m compileall -q "${PYFILES[@]}"
            echo "OK: 已检查 ${#PYFILES[@]} 个 Python 文件"
          fi

      - name: 计算版本标识
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="dev-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "版本标识: $V"

      - name: 确保 zip 可用
        run: which zip || { sudo apt-get update -qq && sudo apt-get install -y -qq zip; }

      - name: 打包（be + re 合并成一个 zip）
        run: |
          set -e
          BE='${{ steps.dirs.outputs.be }}'
          RE='${{ steps.dirs.outputs.re }}'
          V='${{ steps.ver.outputs.v }}'
          NAME="${MOD_NAME}"

          rm -rf stage out
          mkdir -p stage/behavior_pack stage/resource_pack out
          cp -a "${BE%/}/." stage/behavior_pack/
          cp -a "${RE%/}/." stage/resource_pack/

          # 网易行为包强制目录：不存在就补建空目录
          for d in ${REQUIRED_BE_DIRS}; do
            mkdir -p "stage/behavior_pack/${d}"
          done

          # 剔除开发环境残留与垃圾文件
          find stage -type d \( -name '__pycache__' -o -name '.mcs*' \) -prune -exec rm -rf {} + || true
          find stage -type f \( -name '*.py[cod]' -o -name '.DS_Store' -o -name 'Thumbs.db' \
            -o -name 'studio.json' -o -name '.mcdev.json' -o -name 'work.mcscfg' \
            -o -name 'world_*_packs.json' \) -delete

          (cd stage && zip -qr "../out/${NAME}_${V}.zip" behavior_pack resource_pack)

          echo '--- 强制目录检查（zip 内）---'
          unzip -Z1 "out/${NAME}_${V}.zip" > /tmp/zip_list.txt
          FAILED=0
          for d in ${REQUIRED_BE_DIRS}; do
            if grep -qx "behavior_pack/${d}/" /tmp/zip_list.txt; then
              echo "OK: behavior_pack/${d}/"
            else
              echo "::error::产物缺少强制目录 behavior_pack/${d}/"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

          (cd out && sha256sum ./* > SHA256SUMS.txt)
          ls -l out
          cat out/SHA256SUMS.txt
          echo '--- zip 内容（前 15 项）---'
          unzip -l "out/${NAME}_${V}.zip" | head -15

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_NAME }}-${{ steps.ver.outputs.v }}
          path: out/*
          if-no-files-found: error

      - name: 附加到 Release（仅 tag 推送）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true